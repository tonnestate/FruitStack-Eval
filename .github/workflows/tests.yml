name: FruitStack-Eval tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q fruitstack_eval
