# Confirmatory freeze (gate G7). Filled in by the owner after the pilot, from the
# `sample_size_proposal` of `fse pilot analyze`, before any confirmatory data exist.
# Deposit it together with the files listed by `fse deposit build`.

[freeze]
margin = 0.10                 # H4 non-inferiority margin (first confirmatory round)
discordance_psi = 0.0         # REPLACE: psi used for planning (pilot upper interval bound)
paired_tasks = 0              # REPLACE: from fse power paired --margin ... --discordance ...
alpha_one_sided = 0.025
power = 0.80
rubric = "FSE-RUBRIC/1"
inquiry_schema = "FSE-INQUIRY/1"
g2_thresholds = "G2-THRESHOLDS/1"
pilot_procedure = "PILOT-PROC/1"
