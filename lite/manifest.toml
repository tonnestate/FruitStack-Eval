# FruitStack-Lite: the minimal configuration hypotheses H1 to H3 need.
# Commits stay UNPINNED until readiness gate G1 (merges, main == sync/local-truth)
# has passed in every listed repository. An UNPINNED entry keeps gate G6 closed.
#
# Revised 11 Oct 2026 against what the pilot arms actually execute
# (runners/pilot_inquiry.py): MangoMe and PomeloMe were removed. CherryMe keeps its
# evidence ledger in its own workspace and no arm calls MangoMe; the zero-cost guard
# that acts in the execution path is PlumMe's FREE_ONLY policy (G3), not PomeloMe.
# CogC enters only if the host configures its output-economy skill as a global skill.

[[component]]
name = "plumme"
repo = "tonnestate/PlumMe"
role = "labor market for free models, decision log with propensities"
needed_for = ["H1", "H2", "H3"]
commit = "UNPINNED"

[[component]]
name = "cherryme"
repo = "tonnestate/CherryMe"
role = "inquiry engine and adaptive ensemble"
needed_for = ["H1", "H2", "H3"]
commit = "UNPINNED"

[[component]]
name = "appleme"
repo = "tonnestate/AppleMe"
role = "trajectory assurance without LLM"
needed_for = ["H1", "H3"]
commit = "UNPINNED"

[[component]]
name = "cogc"
repo = "tonnestate/CogC"
role = "shared output-economy skill, only when PLUMME_GLOBAL_SKILL_IDS includes output-economy"
needed_for = ["host configuration"]
commit = "UNPINNED"

[[component]]
name = "fruitstack-eval"
repo = "tonnestate/FruitStack-Eval"
role = "independent evaluator"
needed_for = ["H1", "H2", "H3"]
commit = "UNPINNED"
