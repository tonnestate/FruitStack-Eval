# FruitStack-Lite: the minimal configuration hypotheses H1 to H3 need.
# Commits stay UNPINNED until readiness gate G1 (merges, main == sync/local-truth)
# has passed in every listed repository. An UNPINNED entry keeps gate G6 closed.
#
# Revised 13 Oct 2026 on the owner's instruction: evaluations run on the whole FruitStack, never on parts. The minimal
# configuration therefore lists every part the arms execute or depend on, PomeloMe (zero-cost guard) and PeachMe
# (personnel department, admission) included. CogC enters as the shared output-economy skill.

[[component]]
name = "plumme"
repo = "tonnestate/PlumMe"
role = "labor market for free models, decision log with propensities"
needed_for = ["H1", "H2", "H3"]
commit = "UNPINNED"

[[component]]
name = "cherryme"
repo = "tonnestate/CherryMe"
role = "inquiry engine and adaptive ensemble"
needed_for = ["H1", "H2", "H3"]
commit = "UNPINNED"

[[component]]
name = "appleme"
repo = "tonnestate/AppleMe"
role = "trajectory assurance without LLM"
needed_for = ["H1", "H3"]
commit = "UNPINNED"

[[component]]
name = "peachme"
repo = "tonnestate/PeachMe"
role = "personnel department: session, step and admission authority for every call"
needed_for = ["H1", "H2", "H3"]
commit = "UNPINNED"

[[component]]
name = "pomelome"
repo = "tonnestate/PomeloMe"
role = "zero-cost guard"
needed_for = ["H1", "H2", "H3"]
commit = "UNPINNED"

[[component]]
name = "cogc"
repo = "tonnestate/CogC"
role = "shared output-economy skill, only when PLUMME_GLOBAL_SKILL_IDS includes output-economy"
needed_for = ["host configuration"]
commit = "UNPINNED"

[[component]]
name = "fruitstack-eval"
repo = "tonnestate/FruitStack-Eval"
role = "independent evaluator"
needed_for = ["H1", "H2", "H3"]
commit = "UNPINNED"
