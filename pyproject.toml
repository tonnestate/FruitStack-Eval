[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitstack-eval"
version = "0.2.0"
description = "Independent research instrumentation for the zero-marginal-cost FruitStack protocol"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fse = "fruitstack_eval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fruitstack_eval*"]
