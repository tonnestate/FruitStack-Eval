# Readiness gate G1 (protocol v0.2, §5.5): the repository states that the pilot arms
# F1 and F3 need, checked from git only with `fse integrity`.
#
# Content requirements (version, paths) are used instead of exact proposal SHAs where
# a truth writer may legitimately re-commit a proposal (release commit, squash).
# Exact SHAs are required only where the proposal itself is the accepted artifact.
# Version 1, written 2026-10-11 before any pilot data exist.

[repo.plumme]
reason = "Labor market for every free arm: FREE_ONLY guard, model fingerprint, typed ENSEMBLE decisions; CherryMe ACE requires plumme>=0.1.8"
version_file = "src/plumme/__init__.py"
min_version = "0.1.8"
required_paths = [
  "src/plumme/fingerprint.py",
  "src/plumme/lease_fence.py",
  "src/plumme/skill_resolver.py",
]

[repo.cherryme]
reason = "Arm F3 (evidence ledger, bootstrap ensemble rule, salvage, assurance): Adaptive Cognitive Ensemble from web/chatgpt"
required_paths = [
  "cherryme/ensemble.py",
  "skill/ensemble/SKILL.md",
  "skill/ensemble/orchestration.json",
]

[repo.appleme]
reason = "Trajectory and claim assurance used by F3; CherryMe ACE passes its tests against AppleMe main 8dfc33f (0.1.2)"
version_file = "src/appleme/__init__.py"
min_version = "0.1.1"
