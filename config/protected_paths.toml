# Protected paths for governed self-modification (protocol learning loop 4).
# A commit carrying the trailer "FruitStack-Origin: system" may never touch these paths.
# Other commits touching them are listed for explicit host review.
# Every path below was verified to exist on 11 Oct 2026 (main or the active proposal branch).
# MangoMe, SPARI, IntakeGov and further repositories still need entries.

[repos.plumme]
paths = [
  "AGENTS.md",
  ".github/workflows/*",
  "src/plumme/budget.py",
  "src/plumme/circuit.py",
  "src/plumme/credentials.py",
  "src/plumme/decisions.py",
  "src/plumme/evaluation.py",
  "src/plumme/lease_fence.py",
  "src/plumme/market.py",
  "src/plumme/peachme_admission.py",
  "src/plumme/policy.py",
  "src/plumme/receipts.py",
  "src/plumme/selection.py",
]

