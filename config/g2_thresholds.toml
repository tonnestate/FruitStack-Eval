# Readiness gate G2 (protocol v0.2, §5.5): thresholds for "measured-independent free
# provider groups". Frozen on 2026-10-11 before any calibration data exist. Changing a
# value after the first calibration run requires a new version and a note in the report.
#
# Rationale:
# - 60 calibration tasks per group (min_calls) give phi a bootstrap interval of about
#   +-0.25; fewer calls would make the independence verdict mostly noise.
# - A group must complete at least 80 % of its calls end to end with a receipt
#   (min_execution_rate), otherwise it is not usable supply for the arms.
# - Two groups count as independent when the phi coefficient of their error indicators
#   is at most 0.5 and at most half of their joint errors are the same wrong answer.
#   Identical wrong answers defeat majority voting; correlated difficulty alone does not.
# - Three such groups are the minimum the protocol requires.

[g2]
version = "G2-THRESHOLDS/1"
min_calls = 60
min_execution_rate = 0.8
min_shared_tasks = 40
max_phi = 0.5
max_same_wrong_share = 0.5
min_groups = 3
bootstrap = 2000
seed = 20261011
