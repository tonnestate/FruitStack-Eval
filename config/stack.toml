# Stack preflight (`fse stack`): every FruitStack part an evaluation runs with, installed from its canonical checkout.
# A required component that fails blocks the run. Distribution names are the pip names; `units` are systemd units that
# must be active; `paths` must exist. The host operator completes units and paths for the VPS (this file is the default).

[component.plumme]
dist = "plumme"
role = "labor market (WorkerStore): recruits every free worker and gives it role, Skills, lease and budget"

[component.peachme]
dist = "peachme"
role = "personnel department: session, step and admission authority for every call"

[component.cherryme]
dist = "cherryme"
role = "inquiry engine with the adaptive ensemble (arm F3)"

[component.appleme]
dist = "appleme"
role = "trajectory and claim assurance used by CherryMe"

[component.pomelome]
dist = "pomelome"
role = "zero-cost guard"

[component.cogc]
role = "shared output-economy Skill; required when PLUMME_GLOBAL_SKILL_IDS includes output-economy"
paths = ["/root/fruits/sync/CogC/skill/output-economy/SKILL.md"]

[component.omniroute]
role = "free-tier gateway carrying the provider connections (PlumMe source)"
units = ["avcos-omniroute.service"]

[component.mangome]
dist = "mangome"
required = false
role = "work state and evidence ledger"
